# Standalone (own `[workspace]`) so the main NewTOS workspace's host
# builds never try to compile this no_std AArch64 program. Built by
# `cargo xtask build-programs`, which embeds the ELF into the kernel.
[workspace]

[package]
name = "lineecho"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "First real compiled NewTOS program: a Cconrs line-echo demo"

[[bin]]
name = "lineecho"
path = "src/main.rs"

[profile.release]
panic = "abort"
opt-level = "z"        # smallest code — must fit the loader's 4 KiB page
lto = true
codegen-units = 1
strip = false          # keep the ELF parseable; objcopy not used
