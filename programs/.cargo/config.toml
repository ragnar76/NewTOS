# Build configuration for the NewTOS Rust user programs (programs/).
#
# The target is the kernel's (rust-toolchain.toml pins the toolchain and
# ships this target's precompiled core/alloc). Programs are linked as a
# position-independent executable (ELF ET_DYN, sdk/newtos.ld): the code
# must therefore be compiled PIC -- `aarch64-unknown-none-softfloat`'s
# default relocation model is `static`, which would place pointer-holding
# constants in .rodata and make `-z text` refuse the link.
#
# These flags are appended to the repository's own
# [target.aarch64-unknown-none-softfloat] rustflags (../.cargo/config.toml,
# force-frame-pointers), which Cargo merges from the parent directory.
[build]
target = "aarch64-unknown-none-softfloat"
# Inside the repository's ignored /target, not a new build directory.
target-dir = "../target/programs"
# Path-independent crate hashes (DESK43 U9-2): the program files -- NEWDESK.NAP
# is embedded in the kernel image -- must not depend on the checkout path.
# Cargo hashes the absolute path of `tos-types` (outside this workspace) into
# every crate's `-C metadata`; the wrapper replaces it with a hash of the
# crate's identity. Rationale in the script.
rustc-wrapper = "./rustc-stable-metadata.sh"

[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "relocation-model=pic"]
