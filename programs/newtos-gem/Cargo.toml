[package]
name = "newtos-gem"
version = "0.1.0"
description = "Runtime for NewTOS native Rust programs: GEMDOS/AES/VDI trap bindings, a GlobalAlloc over GEMDOS Malloc hunks, the panic handler"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
test = false
bench = false

[dependencies]
# The shared GEM records and constants (Object/TedInfo/IconBlk/Grect, G_*, WF_*,
# WM_*, MU_*, ...): one home for kernel, AES and programs (DESK43 U5b).
# Dependency-free, `no_std`.
tos-types = { path = "../../tos-types" }
