cargo-features = ["per-package-target"]

[package]
name = "tos-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "NewTOS TOS-API surface (GEMDOS / BIOS / XBIOS dispatchers and syscalls)"
forced-target = "aarch64-unknown-none-softfloat"

[lib]
name = "tos_api"
path = "src/lib.rs"

[dependencies]
tos-types = { path = "../tos-types" }
