name: Bug report (Fehler melden)
description: Something does not work or behaves differently from a real Atari. / Etwas funktioniert nicht oder verhaelt sich anders als auf einem echten Atari.
title: "[Bug] "
labels: ["bug", "neu"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The more exact the steps, the faster we find the bug. English or German, both are fine.
        Danke fuers Testen! English oder Deutsch, beides ist willkommen.
        Crash report (text with "pc=" and registers)? Please attach a photo. / Absturzbericht? Bitte ein Foto anhaengen.
  - type: input
    id: version
    attributes:
      label: NewTOS version (Version)
      description: Shown on the boot screen and under "Desk > Desktop info".
      placeholder: "0.6"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do? (Was hast du gemacht?)
      description: Step by step, so someone else can repeat it.
      placeholder: |
        1. Started QED
        2. Opened C:\TEST.TXT
        3. ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened? (Was ist passiert?)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? (Was hast du erwartet?)
      description: How does a real Atari (TOS 4 / EmuTOS) behave, if you know?
  - type: dropdown
    id: repro
    attributes:
      label: Does it happen again? (Passiert es wieder?)
      options:
        - always / immer
        - sometimes / manchmal
        - seen only once / nur einmal
    validations:
      required: true
  - type: dropdown
    id: after
    attributes:
      label: Did the system keep running? (Lief das System weiter?)
      options:
        - yes / ja
        - after a key press (crash report) / nach Tastendruck
        - only after restart or power cycle / nur nach Neustart
  - type: textarea
    id: setup
    attributes:
      label: Your setup (Dein Aufbau)
      description: Pi 4 RAM, monitor/resolution, keyboard and mouse, SD card, other USB devices.
      placeholder: "Pi 4, 4 GB; Dell 24in 1920x1080 HDMI; Cherry keyboard DE; Logitech mouse; SanDisk 16 GB, FAT16 2 GB"
  - type: textarea
    id: extra
    attributes:
      label: Photos, logs, anything else (Fotos, Logs, Sonstiges)
      description: Drag images here. If you have a serial console, the log helps.
