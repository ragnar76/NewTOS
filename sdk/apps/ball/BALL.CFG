# BALL.CFG -- settings for the bouncing-ball demo.
#
# Copy this into the ROOT OF C:, beside BALL.PRG / BALLTC.PRG / BALL.NAP.
# The demo reads it once at start-up; it is optional, and without it every
# value below is the built-in default.
#
# Format: one `key value` per line. `#` starts a comment and runs to the end
# of the line. Blank lines are ignored, and so is anything the parser cannot
# read -- a missing file, an unknown key, an unreadable number, a value out
# of range. None of them stop the demo, all of them leave the default in
# place, and every one of them is COUNTED AND NAMED in C:\BALL.LOG. If a
# setting did not take, the log says so; it never goes quietly unread.
#
# ---------------------------------------------------------------------------
# ball F
# ---------------------------------------------------------------------------
# The ball's diameter as a FRACTION OF THE SCREEN WIDTH -- not a pixel count.
# Every size in this demo is a fraction of the screen the VDI reported, which
# is what makes it the same picture at 640x480 and at 1920x1080; a pixel count
# would be right on one machine and wrong on the next. The log states the
# fraction AND the diameter it came to, so a log on its own says what was run.
#
# Default 0.16. The demo's own geometry is the ceiling -- never wider than
# 0.18 of the screen, never more than a third of the height of the room it has
# to bounce in -- and a value above that is clamped, with the clamp named in
# the log.
#
# It is not only a matter of looks. On a single-buffered screen that cannot
# page-flip -- the ST with PiStorm is one -- the blit IS the presentation, so
# the ball's size is also how long the screen is being written for and
# therefore how much of the frame the scanout can catch. The two pull against
# each other and only the picture can settle it. Measured at 1920x1072 on the
# ST, per frame:
#
#     0.06  ->  114 px   0.78 ms blit   tallest rectangle 129 rows
#     0.10  ->  192 px   1.54 ms blit   ...               206 rows
#     0.16  ->  306 px   3.31 ms blit   ...               319 rows   (default)
#     0.18  ->  344 px   4.09 ms blit   ...               356 rows   (ceiling)
#
# Uncomment and edit:
#
#ball 0.16
