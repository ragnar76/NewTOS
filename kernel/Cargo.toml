cargo-features = ["per-package-target"]

[package]
name = "kernel"
version = "0.5.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "NewTOS kernel: bare-metal AArch64 core (boot, HAL, drivers)"
forced-target = "aarch64-unknown-none-softfloat"

[lib]
name = "kernel"
path = "src/lib.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"

[features]
default = []
# Mutually exclusive board selection; exactly one must be enabled.
board-rpi4 = []
board-qemu-virt = []
# Pass-through for the AES trap-path tracer (`tos_api::aes::trace`). Off by
# default; build with `--features aes-trace` to instrument the AES trap path.
aes-trace = ["tos-api/aes-trace"]
# Boot-screen (initinfo) diagnostic build: records what EmuTOS' initinfo wait
# loop actually saw on the machine (clock, key ring, modifier state, iteration
# count, exit reason) and, instead of continuing the boot, shows it on screen
# and stops. Off by default; a temporary instrument for the real-Pi-4
# "boot screen not held" investigation, built with
# `cargo xtask build --board rpi4 --release --features initinfo-diag`.
initinfo-diag = []
# Pass-through for the GEMDOS trap-path tracer (`tos_api::gemdos::trace`). Off
# by default; build with `--features gemdos-trace` to instrument the GEMDOS
# trap path (what an application actually asks the file system for).
gemdos-trace = ["tos-api/gemdos-trace"]
# AES/GEMDOS call-sequence oracle (DESK43 U5a, guard G2 prerequisite): the
# temporary `svc` tracer `dbg_qedtrace` in sequence mode -- every `svc` from any
# caller recorded in completion order with a caller column (K = kernel/EL1
# desktop, U<slot> = EL0 process), written to `C:\SVCSEQ.LOG` at every
# `evnt_multi` entry; `tools/svc-seq.py` extracts the diffable sequence. Off by
# default (the hooks fold away); `cargo xtask build --board rpi4 --features
# svc-seq-trace`. Writes to C:, so only for a test card.
svc-seq-trace = []
# microSD / FAT / GEMDOS-file self-test build (board-rpi4 / QEMU raspi4b):
# runs `selftest_emmc::run()` right after the card is mounted at boot -- the
# Phase-09 block-device, FAT, Fopen/Fsfirst/Dsetpath, Fattrib/Frename/Fdatime
# and Fwrite checks -- and then continues the boot. Its Fattrib checks are
# hard assertions (a failure is a `[PANIC]` line naming the case, TASK/T06).
# It WRITES to C: (creates and removes META.TXT / RENAMED.TXT / CLIPBRD / a
# write-test file), so build it only for a test image, never for a user's
# card. Off by default; `cargo xtask build --board rpi4 --features selftest-emmc`.
# This is the one boot-path gate the `selftest_*` modules have: without it
# they are compiled but never called (docs/sdk/06-image-and-testing.md).
selftest-emmc = []
# USB enumeration diagnostic build: tees every `kprint!` line into a RAM
# buffer and writes it to `C:\\USBDIAG.LOG` once the card is mounted, so a
# machine with no serial line still yields the whole boot log as a file. It
# also turns on the extra xHCI instrumentation that the normal build does not
# carry: the Supported-Protocol capability walk (which root port is USB 2.0 and
# which is USB 3.0), raw PORTSC words, every interface/endpoint of every device
# (not just the one we take), the slot/endpoint/completion code of every event
# consumed during enumeration, and the hub port reset trace (how many tries it
# took and after how long the port enabled).
#
# The measurement this feature was originally built for -- does any port need
# longer than the old fixed 60 ms? -- has been answered on hardware: every
# connected port of both hubs enabled at the first 10 ms sample, in the working
# and in the broken socket arrangement alike. The reset itself now follows
# FreeMiNT `hub.c:225` in BOTH builds; this feature only narrates it.
#
# Off by default. When it landed, the rpi4 build with the feature off was
# measured, not asserted, to be unchanged instruction for instruction (the only
# disassembly differences were LLVM's internal symbol-name hashes; the image
# hash moves only because inserted source lines shift the line numbers panic
# locations carry in `.rodata`). That no longer holds after the transfer
# handshake repair, which changes the normal build on purpose. Built with
# `cargo xtask build --board rpi4 --release --features usb-diag`.
usb-diag = []

[dependencies]
tos-types = { path = "../tos-types" }
tos-api   = { path = "../tos-api" }
xhci = "0.9.2"
